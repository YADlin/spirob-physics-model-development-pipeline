[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spirob-generator"
version = "0.3.0"
description = "Parametric SpiRob geometry, MuJoCo models and fabrication CAD"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "cadquery==2.6.1", "cadquery-ocp==7.8.1.1.post1",
  "matplotlib==3.11.1", "mujoco==3.3.5", "numpy==2.5.3",
  "pandas==2.2.3", "scipy==1.18.1", "trimesh==5.1.0",
  "shapely==2.1.2", "mapbox-earcut==2.0.0", "networkx==3.6.1", "rtree==1.4.1",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[project.scripts]
spirob-build = "build:main"
spirob-designer = "tools.designer:main"

[tool.setuptools]
py-modules = ["build"]

[tool.setuptools.packages.find]
include = ["spirob*", "tools*", "fabrication*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
